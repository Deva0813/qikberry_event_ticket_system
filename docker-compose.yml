services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qikberry}
      MYSQL_USER: ${MYSQL_USER:-qikberry}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-qikberrypass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    restart: unless-stopped
    # Prisma's MongoDB connector requires the server to run as a replica set
    # (even a single-node one), so it can use change streams / transactions.
    command: ["--replSet", "rs0", "--bind_ip_all","--quiet"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot job: initiates the rs0 replica set once mongo is reachable, then exits.
  mongo-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["bash", "-c"]
    command:
      - |
        mongosh --host mongo:27017 --eval '
          try {
            rs.status();
            print("Replica set already initiated");
          } catch (e) {
            print("Initiating replica set...");
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
          }
        '

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    environment:
      PORT: ${PORT:-4000}
      NODE_ENV: ${NODE_ENV:-development}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4000}
      MYSQL_DATABASE_URL: mysql://${MYSQL_USER:-qikberry}:${MYSQL_PASSWORD:-qikberrypass}@mysql:3306/${MYSQL_DATABASE:-qikberry}
      MONGODB_DATABASE_URL: mongodb://mongo:27017/${MONGO_DATABASE:-qikberry}?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:-replace_this_with_a_long_random_string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - src_generated:/app/src/generated

volumes:
  mysql_data:
  mongo_data:
  src_generated: